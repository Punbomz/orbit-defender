<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#102b40"/>
      <stop offset="1" stop-color="#030b18"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#efffff"/>
      <stop offset=".45" stop-color="#52f3ff"/>
      <stop offset="1" stop-color="#168ba8"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="13" fill="url(#bg)" stroke="#36dfee" stroke-width="2"/>
  <g fill="none" stroke="url(#ring)" filter="url(#glow)" stroke-linecap="round">
    <ellipse cx="32" cy="32" rx="13" ry="22" stroke-width="3.5" transform="rotate(28 32 32)"/>
    <ellipse cx="32" cy="32" rx="22" ry="11" stroke-width="2.1" transform="rotate(-30 32 32)" opacity=".9"/>
    <circle cx="32" cy="32" r="5.2" fill="#061727" stroke-width="2.5"/>
  </g>
  <circle cx="47" cy="16" r="3" fill="#ffd166"/>
</svg>
